<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dream Team - Gestión Oficial Fútbol 7</title>
    <meta name="description" content="Plataforma oficial Dream Team para gestión de equipos de Fútbol 7: convocatorias, alineaciones tácticas, partidos en vivo, votación MVP y comunidad del club." />
    <meta property="og:title" content="Dream Team - Gestión Oficial Fútbol 7" />
    <meta property="og:description" content="Plataforma oficial Dream Team para gestión integral de Fútbol 7: convocatorias, alineaciones tácticas, partidos en vivo y comunidad." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1877F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dream Team" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.jpg" />
    <link rel="icon" type="image/jpeg" href="/icon-192.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F0F2F5] text-[#050505] antialiased selection:bg-[#1877F2] selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0F1E36 0%, #08101E 100%); font-family: 'Outfit', sans-serif; color: white;">
        <div style="position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -4px; border-radius: 28px; background: linear-gradient(135deg, #f59e0b, #1877F2, #f59e0b); animation: dtPulse 2s ease-in-out infinite; opacity: 0.7; filter: blur(6px);"></div>
          <img src="/icon-192.jpg" alt="Dream Team" style="position: relative; width: 100px; height: 100px; border-radius: 24px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.25);" />
        </div>
        <div style="margin-top: 24px; text-align: center;">
          <div style="font-size: 20px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(90deg, #ffffff, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Dream Team</div>
          <div style="font-size: 11px; font-weight: 600; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px;">Fútbol 7 Élite</div>
        </div>
        <div style="margin-top: 28px; width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #1877F2; border-radius: 50%; animation: dtSpin 0.9s linear infinite;"></div>
        <style>
          @keyframes dtSpin { to { transform: rotate(360deg); } }
          @keyframes dtPulse { 0%, 100% { opacity: 0.4; transform: scale(0.96); } 50% { opacity: 0.85; transform: scale(1.04); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
